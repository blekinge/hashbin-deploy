apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hashbin

# SealedSecrets — unpacked by the cluster's sealed-secrets controller into the real
# Secrets. All keep stable names so their consumers' references resolve.
resources:
- ../../base
- sealed-secret-harbor-cred.yaml       # harbor-cred: imagePullSecret for private Harbor
- sealed-secret-hashbin-secrets.yaml   # hashbin-secrets: hmac-secret + jwt-secret
- sealed-secret-simply-credentials.yaml # simply-credentials-hashbin: DNS-01 for the Issuer

# ---------------------------------------------------------------------------
# PINNED IMAGES — edit here (or run scripts/update-images.sh) to roll out a build.
# These are the only two lines that change when CI publishes a new image. ArgoCD
# auto-syncs this overlay, so `git commit && git push` is the whole deploy.
# ---------------------------------------------------------------------------
images:
- name: hashbin-api
  newName: harbor.tools.nyx.kb.dk/blekinge/hashbin-backend
  newTag: latest
- name: hashbin-web
  newName: harbor.tools.nyx.kb.dk/blekinge/hashbin-web
  newTag: latest
