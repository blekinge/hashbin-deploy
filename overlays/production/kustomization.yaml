apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hashbin

# harbor-cred: imagePullSecret for private Harbor (SealedSecret — commit-safe).
resources:
- ../../base
- sealed-secret-harbor-cred.yaml

# ---------------------------------------------------------------------------
# PINNED IMAGES — edit here (or run scripts/update-images.sh) to roll out a build.
# These are the only two lines that change when CI publishes a new image. ArgoCD
# auto-syncs this overlay, so `git commit && git push` is the whole deploy.
# ---------------------------------------------------------------------------
images:
- name: harbor.tools.nyx.kb.dk/blekinge/hashbin-quarkus
  newTag: 1.0.0-SNAPSHOT-main-sha.05cb6c7306d71b084072c74b66e36db910dd5c3a-build.6
- name: harbor.tools.nyx.kb.dk/blekinge/hashbin-web
  newTag: 0.1.0-master-sha.f8a14c9060188f32d19d2806e0b623f8674261c4-build.6
