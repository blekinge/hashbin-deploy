# ArgoCD Application for hashbin (api + web + CloudNativePG).
#
# ArgoCD renders the production Kustomize overlay from THIS repo. The overlay already
# sets `namespace: hashbin`, pins the Harbor image tags, and includes the `harbor-cred`
# SealedSecret (see overlays/production/sealed-secret-harbor-cred.yaml). The cluster's
# sealed-secrets controller unpacks it into the Secret the pods' imagePullSecrets need,
# so ArgoCD alone is enough provided that controller is installed (see README "2. Secrets").
#
# Apply once into your ArgoCD install (ArgoCD itself is not managed by this file):
#   kubectl apply -n argocd -f argocd/application.yaml
# or:  argocd app create -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hashbin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blekinge/hashbin-deploy.git
    targetRevision: master
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: hashbin
  syncPolicy:
    # GitOps: keep the cluster in sync with the overlay automatically. Drop this
    # block if you prefer manual syncs from the UI/CLI.
    automated:
      prune: true      # remove resources deleted from git
      selfHeal: true   # revert manual cluster edits back to git
    syncOptions:
      - CreateNamespace=true   # the overlay also declares the Namespace; this is a safety net
