# Single origin: /api and /q (API, health, Swagger/OpenAPI) -> api service; everything
# else -> the static web service. So config.js can stay at apiBase "/api" and CORS is
# unnecessary. TLS via cert-manager + Cilium: the ClusterIssuer "letsencrypt-simply-hashbin"
# (defined in the cluster infra repo) solves DNS-01 against Simply.com for hashbin.net.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hashbin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-simply-hashbin
    # Cilium forces HTTP->HTTPS now that a `tls:` block is present for the host.
    cilium.io/https-redirect: "true"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - hashbin.net
      secretName: hashbin-tls
  rules:
    - host: hashbin.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hashbin-api
                port:
                  number: 8080
          - path: /q
            pathType: Prefix
            backend:
              service:
                name: hashbin-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hashbin-web
                port:
                  number: 8080
