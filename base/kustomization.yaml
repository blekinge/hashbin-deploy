apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hashbin

labels:
  - pairs:
      app.kubernetes.io/part-of: hashbin
    includeSelectors: false

resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
  - migration-job.yaml
  - hpa.yaml
  - pdb.yaml

# The api/web containers reference the abstract names `hashbin-api` / `hashbin-web`;
# this maps them to the org Harbor registry. The production overlay is the single place
# that pins the real tags (see overlays/production/kustomization.yaml). `newTag` here is
# only a fallback for `kustomize build base` and is never what gets deployed.
#   api = native Quarkus image (built by hashbin-quarkus CI)
#   web = nginx image (built by hashbin-web CI)
images:
  - name: hashbin-api
    newName: harbor.tools.nyx.kb.dk/blekinge/hashbin-quarkus
    newTag: latest
  - name: hashbin-web
    newName: harbor.tools.nyx.kb.dk/blekinge/hashbin-web
    newTag: latest
